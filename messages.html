<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QUUB Messages – Chat with talent and manage your projects.">
    <link rel="icon" type="image/svg+xml" href="/quub-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>Messages - QUUB</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard-page messages-page">
    <div class="dashboard-wrapper">
        <!-- Header -->
        <header class="db-header">
            <div class="db-logo">
                <div class="db-logo-icon">
                    <img src="/quub-logo.png" alt="QUUB Logo" class="logo-img" />
                </div>
                <span class="db-logo-text">QUUB</span>
            </div>
            <div class="db-header-right">
                <div class="user-profile-menu">
                    <img src="https://i.pravatar.cc/150?u=sabin" alt="Sabin Saji" class="user-avatar">
                </div>
            </div>
        </header>

        <main class="db-content">
            <div class="messages-container">
                <!-- Inbox List -->
                <div class="inbox-list" id="inbox-list">
                    <div class="section-header">
                        <h2>Messages</h2>
                        <div class="search-messages">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </div>
                    </div>
                    
                    <div class="convo-list">
                        <div class="convo-item active" onclick="openChat('Annie')">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Annie" alt="Annie" class="convo-avatar">
                            <div class="convo-info">
                                <div class="convo-top">
                                    <span class="convo-name">Annie</span>
                                    <span class="convo-time">2m</span>
                                </div>
                                <p class="convo-preview">Hey! I saw your React project and I'm interested in working with you.</p>
                            </div>
                            <div class="unread-dot"></div>
                        </div>
                    </div>
                </div>

                <!-- Chat Area (Hidden on mobile unless active) -->
                <div class="chat-area" id="chat-area">
                    <div class="chat-header">
                        <button class="back-btn" onclick="closeChat()">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
                        </button>
                        <div class="chat-user">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Annie" alt="Annie" class="chat-avatar">
                            <div class="chat-user-info">
                                <span class="chat-name">Annie</span>
                                <span class="chat-status">Online</span>
                            </div>
                        </div>
                        <div class="chat-actions">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                        </div>
                    </div>

                    <div class="chat-messages">
                        <div class="msg-group received">
                            <div class="msg-bubble">Hey! I saw your React project and I'm interested in working with you.</div>
                            <span class="msg-time">2:30 PM</span>
                        </div>
                        <div class="msg-group sent">
                            <div class="msg-bubble">That's great! Can you show me some of your previous work?</div>
                            <span class="msg-time">2:32 PM</span>
                        </div>
                    </div>

                    <div class="chat-input-wrap">
                        <div class="chat-input-bar">
                            <input type="text" placeholder="Type a message...">
                            <button class="send-btn">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="/dashboard.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="/jobs.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                <span>Jobs</span>
            </a>
            <a href="/messages.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Messages</span>
            </a>
            <a href="/profile.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Profile</span>
            </a>
        </nav>
    </div>
    <script type="module" src="/main.js"></script>
    <script>
        function openChat() {
            document.getElementById('inbox-list').classList.add('hidden');
            document.getElementById('chat-area').classList.add('active');
        }
        function closeChat() {
            document.getElementById('inbox-list').classList.remove('hidden');
            document.getElementById('chat-area').classList.remove('active');
        }
    </script>
</body>
</html>
